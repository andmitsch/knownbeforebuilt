<h2 id="s7h" class="author-title">Andreas Mitschke</h2>
<p class="author-text-2">I've spent over fifteen years running experiments on products, initially for B2C and SaaS companies, and later for B2B industrial and deep tech organisations. My non-linear venture journey began at the age of 15 with web design services and building a travel experience platform. I wrote Known Before Built out of the stark contrast between these worlds. In high-volume tech, “ship fast at all costs, learn, repeat” is a working mantra because a failed release costs you a few anonymous users, a silent digit in churn. In organisations whose customers have names, that same method costs you a relationship. <br>It is for those who must decide what is worth building first. I've advised start-ups and scale-ups through funds including 500 Global and Loyal VC, evaluated and brokered deal flow for venture funds across Europe, New York and Silicon Valley, and helped build Germany's largest academic deep tech programme with KIT. Closer to the ground, I coached founders at Mannheim's startup centres and lectured on entrepreneurship and product discovery at universities in Germany.</p>
