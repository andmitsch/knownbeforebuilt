@property --p{syntax:'<number>';inherits:false;initial-value:1}

a{color:#111111;text-decoration-color:#F57106;text-decoration-thickness:2px;text-underline-offset:5px}

sub{font-size:.56em;vertical-align:-.3em;line-height:0}

.spin{transform-origin:50% 50%;animation:kbspin 1.1s steps(12) infinite}
@keyframes kbspin{to{transform:rotate(360deg)}}
.breathe{animation:kbbreathe 9s ease-in-out infinite}
@keyframes kbbreathe{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.025) rotate(1.2deg)}}
.paint{-webkit-mask:conic-gradient(from 200deg,#000 calc(var(--p) * 360deg),transparent 0);mask:conic-gradient(from 200deg,#000 calc(var(--p) * 360deg),transparent 0);animation:kbpaint 2.8s cubic-bezier(.65,0,.25,1) .2s both}
@keyframes kbpaint{from{--p:0}to{--p:1}}
.drift1{animation:kbdrift 16s ease-in-out infinite}
.drift2{animation:kbdrift 21s ease-in-out -7s infinite reverse}
.drift3{animation:kbdrift 26s ease-in-out -13s infinite}
@keyframes kbdrift{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,-20px)}}
.late{animation:kbfade .7s ease 1.9s both}

.flow{animation:kbflow 6s linear infinite}
.flow2{animation:kbflow 9s linear infinite}
@keyframes kbflow{to{stroke-dashoffset:-400}}
.book3d{transform-style:preserve-3d;animation:kbturn 11s ease-in-out infinite alternate}
@keyframes kbturn{from{transform:rotateX(-6deg) rotateY(32deg)}to{transform:rotateX(-6deg) rotateY(-26deg)}}
.bookshadow{animation:kbshadow 11s ease-in-out infinite alternate}
@keyframes kbshadow{from{transform:translateX(-18px) scaleX(0.9)}to{transform:translateX(18px) scaleX(1.05)}}
.blob{animation-name:kbblob,kbswell;animation-timing-function:linear,ease-in-out;animation-iteration-count:infinite,infinite}
.glowblob{opacity:0;animation-name:kbblob,kbglowop;animation-timing-function:linear,ease-in-out;animation-iteration-count:infinite,infinite}
@keyframes kbblob{0%{transform:translate(-80px,704px)}20%{transform:translate(220px,692px)}40%{transform:translate(520px,707px)}60%{transform:translate(860px,697px)}80%{transform:translate(1160px,692px)}100%{transform:translate(1520px,704px)}}
@keyframes kbswell{0%,100%{r:18px}50%{r:34px}}

.wave1{animation:kbwave1 7s linear infinite}

.bob{animation:kbwave1 7s linear infinite,kbbob 5s ease-in-out infinite}
@keyframes kbbob{0%,100%{margin-top:0}50%{margin-top:2px}}
.wave2{animation:kbwave2 16s linear infinite}
@keyframes kbwave2{from{transform:translateX(0)}to{transform:translateX(-240px)}}
.wave3{animation:kbwave3 21s linear infinite reverse}
@keyframes kbwave3{from{transform:translateX(0)}to{transform:translateX(-300px)}}
.still .wave1,.still .bob,.still .wave2,.still .wave3{animation:none}
.still .blob{display:none}
.still .blob,.still .glowblob,.still .rib,.still .spin,.still .breathe,.still .paint,.still .drift1,.still .drift2,.still .drift3,.still .late,.still .flow,.still .flow2,.still .book3d,.still .bookshadow{animation:none}

.kbstage{--w:300px;--h:480px;--t:41px;width:var(--w);height:var(--h);perspective:1400px;cursor:grab;touch-action:pan-y;-webkit-user-select:none;user-select:none}
